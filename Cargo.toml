[package]
name = "proc-manager"
version = "0.1.0"
edition = "2021"
description = "A high-performance cross-platform process manager TUI"

[[bin]]
name = "prc"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
sysinfo = "0.33"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
